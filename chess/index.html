<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Chess — Neon Arcade</title>
    <meta name="description" content="Play Neon Chess: Strategic futuristic neon chess with smart AI and 2-Player battle.">
    
    <meta name="theme-color" content="#050816">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/images/icon-192.png">

    <link rel="stylesheet" href="/assets/css/chess.css">
    <!-- Auth Guard -->
    <script src="/assets/js/auth-guard.js"></script>
</head>
<body>
    <div class="bg-glow bg-glow-1" aria-hidden="true"></div>
    <div class="bg-glow bg-glow-2" aria-hidden="true"></div>

    <div class="chess-container">
        <!-- Header -->
        <header class="chess-header">
            <a href="/hub" class="nav-back-link" title="Return to Arcade Hub">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
                <span>Arcade Hub</span>
            </a>

            <div class="chess-title">
                <h1>NEON <span>CHESS</span></h1>
            </div>

            <div class="chess-controls-top">
                <button id="themeToggleBtn" class="mini-btn" title="Toggle Theme" aria-label="Toggle Theme">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Status & Mode Bar -->
        <div class="status-bar">
            <div class="mode-selectors">
                <button id="modeAiBtn" class="mode-btn active">VS AI</button>
                <button id="mode2pBtn" class="mode-btn">2 PLAYER</button>
            </div>
            <div class="turn-status-badge" id="turnIndicator">
                <span class="turn-dot turn-white"></span>
                <span>Cyan (White)</span>
            </div>
        </div>

        <!-- Captured Pieces Tracker -->
        <div class="captured-bar">
            <div class="captured-side captured-cyan" id="capturedWhite" title="Pieces captured by Cyan"></div>
            <div style="font-size:0.75rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); font-weight:700;">CAPTURES</div>
            <div class="captured-side captured-pink" id="capturedBlack" title="Pieces captured by Pink"></div>
        </div>

        <!-- The 8x8 Chess Board Stage -->
        <main class="chess-board-wrap">
            <div class="chess-grid" id="chessGrid"></div>
        </main>

        <!-- Action Controls Bar -->
        <div class="game-actions-bar">
            <button id="resetBtn" class="chess-action-btn btn-reset">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                    <path d="M3 3v5h5"/>
                </svg>
                Restart Game
            </button>
        </div>
    </div>

    <!-- Victory Modal -->
    <div class="victory-modal-overlay" id="victoryModalOverlay">
        <div class="victory-modal">
            <h2 id="victoryTitle">CHECKMATE!</h2>
            <p id="victoryDesc">Tactical neon victory achieved.</p>
            <button id="victoryPlayAgain" class="chess-action-btn btn-reset" style="width:100%; justify-content:center;">
                Play Again
            </button>
        </div>
    </div>

    <script src="/assets/js/chess.js"></script>
</body>
</html>
