<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Gaming — Online Play</title>
    <!-- Inline Auth Guard -->
    <script>
        (function(){
            try {
                var s = JSON.parse(localStorage.getItem('neonGaming_session')||'null');
                var maxAge = 7*24*60*60*1000;
                var valid = s && s.username && (!s.loginTime || (Date.now()-s.loginTime) < maxAge);
                if(!valid) { window.location.replace('/auth'); }
            } catch(e) { window.location.replace('/auth'); }
        })();
    </script>
    <link rel="stylesheet" href="../assets/css/online.css">
    <style>.ic{width:18px;height:18px;display:inline-block;vertical-align:middle;stroke:currentColor;}</style>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth-guard.js"></script>
</head>
<body>

    <!-- BACKGROUND -->
    <div class="bg" aria-hidden="true">
        <div class="bg-grid"></div>
        <div class="glow glow-a"></div>
        <div class="glow glow-b"></div>
        <div class="glow glow-c"></div>
    </div>

    <!-- ═══════════════════════════════════════
         SCREEN 1 — LOBBY (Create / Join)
    ═══════════════════════════════════════ -->
    <div class="screen active" id="lobbyScreen">
        <div class="card lobby-card">

            <a href="../" class="back-btn" aria-label="Back to home"><svg class="ic" style="width:14px;height:14px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 5-7 7 7 7"/></svg> BACK</a>

            <div class="logo" aria-hidden="true">
                <span class="logo-x"><svg class="ic" style="width:13px;height:13px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></span>
                <span class="logo-o">○</span>
            </div>

            <h1 class="page-title">ONLINE <span>BATTLE</span></h1>
            <p class="page-sub">Challenge a friend anywhere in the world</p>

            <!-- Player name -->
            <div class="input-wrap">
                <label for="lobbyName" class="input-label">YOUR NAME</label>
                <input type="text" id="lobbyName" maxlength="15"
                    placeholder="Enter your name" autocomplete="off" spellcheck="false">
            </div>

            <div class="lobby-divider">
                <span class="ld-line"></span>
                <span class="ld-text">CHOOSE ACTION</span>
                <span class="ld-line"></span>
            </div>

            <!-- Create Room -->
            <button class="action-btn create-btn" id="createRoomBtn">
                <span class="ab-icon" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="3"/><path d="M7 12h4"/><path d="M9 10v4"/><circle cx="16" cy="11" r="1" fill="currentColor"/><circle cx="18" cy="13" r="1" fill="currentColor"/></svg></span>
                <div>
                    <strong>CREATE ROOM</strong>
                    <small>Get a room code to share</small>
                </div>
            </button>

            <!-- Join Room -->
            <div class="join-wrap">
                <div class="input-wrap">
                    <label for="joinCodeInput" class="input-label">ROOM CODE</label>
                    <input type="text" id="joinCodeInput" maxlength="6"
                        placeholder="Enter 6-digit code"
                        autocomplete="off" spellcheck="false"
                        style="text-transform:uppercase;letter-spacing:6px;font-size:20px;text-align:center">
                </div>
                <button class="action-btn join-btn" id="joinRoomBtn">
                    <span class="ab-icon" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></span>
                    <div>
                        <strong>JOIN ROOM</strong>
                        <small>Enter a friend's room code</small>
                    </div>
                </button>
            </div>

            <!-- Alert -->
            <div class="alert" id="lobbyAlert" role="alert" aria-live="polite"></div>

        </div>
    </div>

    <!-- ═══════════════════════════════════════
         SCREEN 2 — WAITING (Room Created)
    ═══════════════════════════════════════ -->
    <div class="screen" id="waitingScreen">
        <div class="card waiting-card">

            <div class="waiting-icon" aria-hidden="true"><svg class="ic" style="width:48px;height:48px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
            <h2 class="waiting-title">WAITING FOR OPPONENT</h2>
            <p class="waiting-sub">Share this code with your friend:</p>

            <div class="room-code-display" id="roomCodeDisplay" aria-label="Room code">
                ------
            </div>

            <button class="copy-btn" id="copyCodeBtn" aria-label="Copy room code">
                <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> COPY CODE
            </button>

            <div class="waiting-dots" aria-hidden="true">
                <span></span><span></span><span></span>
            </div>

            <p class="waiting-hint">Waiting for player 2 to join…</p>

            <button class="cancel-btn" id="cancelWaitBtn"><svg class="ic" style="width:13px;height:13px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> Cancel</button>

        </div>
    </div>

    <!-- ═══════════════════════════════════════
         SCREEN 3 — ONLINE GAME
    ═══════════════════════════════════════ -->
    <div class="screen" id="gameScreen">

        <!-- Top bar -->
        <div class="game-topbar">
            <div class="game-room-info">
                <span class="room-label">ROOM</span>
                <span class="room-code-small" id="gameRoomCode">——</span>
            </div>
            <div class="conn-status" id="connStatus">
                <span class="conn-dot"></span>
                <span id="connText">Connected</span>
            </div>
            <button class="quit-btn" id="quitBtn"><svg class="ic" style="width:13px;height:13px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> QUIT</button>
        </div>

        <!-- Players -->
        <div class="online-players">
            <div class="oplayer oplayer-x" id="oPlayerX">
                <div class="op-symbol">X</div>
                <div class="op-info">
                    <span class="op-name" id="oNameX">Player X</span>
                    <strong class="op-score" id="oScoreX">0</strong>
                </div>
                <div class="op-turn-indicator" id="oTurnX" aria-hidden="true"></div>
            </div>

            <div class="vs-badge">VS</div>

            <div class="oplayer oplayer-o" id="oPlayerO">
                <div class="op-symbol">O</div>
                <div class="op-info">
                    <span class="op-name" id="oNameO">Player O</span>
                    <strong class="op-score" id="oScoreO">0</strong>
                </div>
                <div class="op-turn-indicator" id="oTurnO" aria-hidden="true"></div>
            </div>
        </div>

        <!-- Turn indicator -->
        <div class="online-turn" id="onlineTurn" role="status" aria-live="polite">
            Your turn
        </div>

        <!-- Board -->
        <div class="online-board" id="onlineBoard" role="grid" aria-label="Tic Tac Toe board">
            <button class="ocell" data-index="0" role="gridcell" aria-label="Row 1, Column 1"></button>
            <button class="ocell" data-index="1" role="gridcell" aria-label="Row 1, Column 2"></button>
            <button class="ocell" data-index="2" role="gridcell" aria-label="Row 1, Column 3"></button>
            <button class="ocell" data-index="3" role="gridcell" aria-label="Row 2, Column 1"></button>
            <button class="ocell" data-index="4" role="gridcell" aria-label="Row 2, Column 2"></button>
            <button class="ocell" data-index="5" role="gridcell" aria-label="Row 2, Column 3"></button>
            <button class="ocell" data-index="6" role="gridcell" aria-label="Row 3, Column 1"></button>
            <button class="ocell" data-index="7" role="gridcell" aria-label="Row 3, Column 2"></button>
            <button class="ocell" data-index="8" role="gridcell" aria-label="Row 3, Column 3"></button>
        </div>

        <!-- Game message -->
        <div class="online-message" id="onlineMessage" role="status" aria-live="polite"></div>

        <!-- Round buttons -->
        <div class="online-btns">
            <button class="online-action-btn" id="rematchBtn" style="display:none"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6"/><path d="M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15"/></svg> REMATCH</button>
            <button class="online-action-btn secondary" id="leaveBtn"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 4h3a2 2 0 0 1 2 2v14"/><path d="M2 20h3"/><path d="M13 20h9"/><path d="M10 12v.01"/><path d="M13 4l-6 2v14l6 2V4z"/></svg> LEAVE</button>
        </div>

    </div>

    <!-- ═══════════════════════════════════════
         RESULT OVERLAY
    ═══════════════════════════════════════ -->
    <div class="result-overlay" id="resultOverlay" aria-hidden="true">
        <div class="result-card">
            <div class="result-icon" id="resultIcon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4a2 2 0 0 1-2-2V5h4"/><path d="M18 9h2a2 2 0 0 0 2-2V5h-4"/><path d="M6 9c0 3.9 2.7 7.2 6 8 3.3-.8 6-4.1 6-8"/><path d="M12 17v4"/><path d="M8 21h8"/></svg></div>
            <h2 class="result-title" id="resultTitle">YOU WIN!</h2>
            <p class="result-msg"  id="resultMsg">Amazing!</p>
            <div class="result-btns">
                <button class="online-action-btn" id="resultRematch"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6"/><path d="M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15"/></svg> REMATCH</button>
                <button class="online-action-btn secondary" id="resultLeave"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg> HOME</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK (single load) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="../assets/js/online.js"></script>

</body>
</html>
