<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Connect 4 — Neon Arcade</title>
    <meta name="description" content="Play Neon Connect 4: 7x6 4-in-a-row cyber arena with smart AI and local 2 player mode.">
    
    <meta name="theme-color" content="#050816">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/images/icon-192.png">

    <link rel="stylesheet" href="/assets/css/connect4.css">
    <!-- Auth Guard -->
    <script src="/assets/js/auth-guard.js"></script>
</head>
<body>
    <div class="bg-glow bg-glow-1" aria-hidden="true"></div>
    <div class="bg-glow bg-glow-2" aria-hidden="true"></div>

    <div class="c4-container">
        <!-- Header -->
        <header class="c4-header">
            <a href="/hub" class="nav-back-link" title="Return to Arcade Hub">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
                <span>Arcade Hub</span>
            </a>

            <div class="c4-title">
                <h1>CONNECT <span>4</span></h1>
            </div>

            <div class="c4-controls-top">
                <button id="themeToggleBtn" class="mini-btn" title="Toggle Theme" aria-label="Toggle Theme">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Mode & Turn Bar -->
        <div class="status-bar">
            <div class="mode-selectors">
                <button id="modeAiBtn" class="mode-btn active">VS AI</button>
                <button id="mode2pBtn" class="mode-btn">2 PLAYER</button>
            </div>
            <div class="turn-indicator">
                <span id="turnDisc" class="disc-sample disc-p1"></span>
                <span id="turnText">Player 1 (Cyan)</span>
            </div>
        </div>

        <!-- Score Tracker -->
        <div class="scoreboard">
            <div class="score-box score-p1">
                <span>PLAYER 1</span>
                <strong id="scoreP1">0</strong>
            </div>
            <div class="score-box score-ties">
                <span>DRAWS</span>
                <strong id="scoreTies">0</strong>
            </div>
            <div class="score-box score-p2">
                <span id="p2Label">CYBER AI</span>
                <strong id="scoreP2">0</strong>
            </div>
        </div>

        <!-- The Connect 4 Board Container -->
        <main class="c4-board-wrap">
            <!-- Drop selectors at the top of each column -->
            <div class="drop-zone" id="dropZone"></div>

            <!-- The 7x6 Grid -->
            <div class="c4-grid" id="c4Grid"></div>
        </main>

        <!-- Game Controls -->
        <div class="game-actions-bar">
            <button id="resetBtn" class="c4-action-btn btn-reset">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                    <path d="M3 3v5h5"/>
                </svg>
                Reset Board
            </button>
        </div>
    </div>

    <!-- Victory Modal -->
    <div class="victory-modal-overlay" id="victoryModalOverlay">
        <div class="victory-modal">
            <h2 id="victoryTitle">VICTORY!</h2>
            <p id="victoryDesc">4 tokens aligned perfectly in the grid.</p>
            <button id="victoryPlayAgain" class="c4-action-btn btn-reset" style="width: 100%; justify-content: center;">
                Play Again
            </button>
        </div>
    </div>

    <script src="/assets/js/connect4.js"></script>
</body>
</html>
